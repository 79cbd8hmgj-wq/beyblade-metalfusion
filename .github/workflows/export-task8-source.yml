name: Export Task 8 source snapshot

on:
  push:
    branches:
      - assistant/task8-functional-custom-blader

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source-only archive
        run: |
          tar \
            --exclude=.git \
            --exclude=build \
            --exclude=work \
            --exclude=dumps \
            --exclude=analysis/generated \
            --exclude=analysis/runtime \
            -czf task8-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: task8-source-${{ github.sha }}
          path: task8-source.tar.gz
          if-no-files-found: error
          retention-days: 1
