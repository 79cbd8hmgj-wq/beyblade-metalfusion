name: Bootstrap G-Revolution Foundation

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Feature branch containing the foundation archive
        required: true
        default: re/g-revolution-foundation
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .foundation-bootstrap.tar.gz.b64
      - .foundation-trigger

permissions:
  contents: write
  pull-requests: read

jobs:
  expand-foundation:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-24.04
    env:
      TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.event.pull_request.head.ref }}
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify and expand foundation archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .foundation-bootstrap.tar.gz.b64
          base64 --decode .foundation-bootstrap.tar.gz.b64 > /tmp/g-rev-foundation.tar.gz
          echo '658630dde5a7f8ed0cbd5a6679826725ac43321b3f38eb4a50518cbe724d7afe  /tmp/g-rev-foundation.tar.gz' | sha256sum --check
          tar -xzf /tmp/g-rev-foundation.tar.gz -C .
          rm -f .foundation-bootstrap.tar.gz.b64 .foundation-trigger .github/workflows/bootstrap-foundation.yml

      - name: Verify toolkit tests without a commercial ROM
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e . pytest
          pytest -q

      - name: Commit expanded toolkit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add G-Revolution reverse-engineering foundation'
          git push origin "HEAD:${TARGET_BRANCH}"
