name: Bootstrap G-Revolution Foundation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .foundation-bootstrap.tar.gz.b64
      - .foundation-trigger

permissions:
  contents: write
  pull-requests: read

jobs:
  expand-foundation:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify and expand foundation archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .foundation-bootstrap.tar.gz.b64 > /tmp/g-rev-foundation.tar.gz
          echo '658630dde5a7f8ed0cbd5a6679826725ac43321b3f38eb4a50518cbe724d7afe  /tmp/g-rev-foundation.tar.gz' | sha256sum --check
          tar -xzf /tmp/g-rev-foundation.tar.gz -C .
          rm -f .foundation-bootstrap.tar.gz.b64 .foundation-trigger .github/workflows/bootstrap-foundation.yml

      - name: Commit expanded toolkit
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add G-Revolution reverse-engineering foundation'
          git push origin "HEAD:${HEAD_BRANCH}"
